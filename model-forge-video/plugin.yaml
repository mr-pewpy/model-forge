name: model-forge-video
kind: backend
version: 1.0.0
requires_hermes: ">=0.23.0"
description: "Model Forge local video generation backend — routes video_generate to any OpenAI-compatible video job API (media gateways, engines with /v1/videos). Disclosure: sends prompts (and optional image inputs) to the single endpoint you configure, reads that endpoint's /models listing to resolve a default model, and polls its video job routes until the job settles. No other network, no telemetry."
author: anai (Pewpy)
license: MIT
python_dependencies:
  - "httpx>=0.27,<1"
config_schema:
  base_url:
    type: str
    default: ""
    label: "Video endpoint base URL"
    description: "Base URL of any endpoint speaking the OpenAI video job API, e.g. http://<host>:<port>/v1."
  default_model:
    type: str
    default: ""
    label: "Default model id"
    description: "Model/workflow id when the caller names none (blank = first from /v1/models)."

name: model-forge
version: 1.0.0
requires_hermes: ">=0.23.0"
description: >-
  Local models for every modality. Find your GPU, pick a model — chat, vision,
  image, image edit, video, 3D, music, SFX, voice, OCR — and Model Forge finds
  the right inference engine, pulls the model (or hands you the exact run
  command), and wires it into
  Hermes.
author: anai (Charles / Pewpy)
license: MIT
config_schema:
  targets_json:
    type: list
    default: []
    label: "Compute targets"
    description: >-
      Extra compute targets as JSON, e.g. [{"id": "remote-1", "label": "Remote
      target", "base_url": "http://<host>:<port>", "kind": "lan", "vram_gb":
      <VRAM>, "ram_gb": <RAM>}]. The model_forge_target_add tool stores targets too (it
      asks for your approval first); entries here win on id conflicts.
      'local' is always present.
  download_roots:
    type: list
    default: []
    label: "Extra download roots"
    description: >-
      Optional absolute directories where model_forge_install may place
      downloaded files, e.g. ["/home/you/models"]. Downloads are always
      confined to the plugin's downloads dir plus these roots; symlinks are
      refused.
  hf_token:
    type: secret
    env: HF_TOKEN
    label: "Hugging Face token"
    description: >-
      Optional. Authenticated pulls from huggingface.co — unlocks gated repos
      and full-speed downloads. Sent only to huggingface.co hosts.
  modelscope_token:
    type: secret
    env: MODELSCOPE_API_TOKEN
    label: "ModelScope token"
    description: >-
      Optional. Authenticated pulls from ModelScope mirrors. Sent only to
      modelscope.cn hosts.
provides_tools:
  - model_forge_status
  - model_forge_browse
  - model_forge_target_add
  - model_forge_install
  - model_forge_activate
  - model_forge_generate_media
provides_hooks:
  - pre_tool_call

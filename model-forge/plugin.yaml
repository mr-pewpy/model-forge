name: model-forge
version: 2.0.1
requires_hermes: ">=0.23.0"
description: >-
  Unified local-AI platform for Hermes — one install ships all 8 tools, the
  native Hermes Desktop workspace (/model-forge, Settings -> Plugins, side
  pane, backend REST API with zero CORS or chat-session limits), and built-in
  image_generate / video_generate providers supporting both OpenAI /v1 APIs
  and direct ComfyUI /prompt workflows. Find your GPU, connect LAN or cloud
  GPUs without JSON, search/pull models across every modality and engine
  (llama.cpp, Ollama, Strata, Project Maya, vLLM, SGLang, ComfyUI, Exo), and
  pipe them natively into Hermes. Disclosure: probes only user-configured
  endpoints (refusing cloud metadata hosts) and the public HuggingFace API
  (disabled with fresh=false); downloads weights into plugin data dir (or
  extra download roots) or runs HTTP /api/pull on your Ollama / Maya target;
  Desktop UI saves user-submitted settings via plugins.manage settings and
  saves/removes HF_TOKEN via Hermes' model.save_key / model.disconnect; writes
  Hermes config (model.*, custom_providers, auxiliary.vision, image_gen,
  video_gen), registers targets, deletes storage, runs pinned checksum-verified
  vendor installers, and launches loopback-only (127.0.0.1) local engines
  (ollama, exo, vllm — minimal env, provenance-tracked stop) only after human
  approval. Optional HF / ModelScope tokens are sent only to their own hosts.
  No telemetry.
author: anai (Pewpy)
license: MIT
config_schema:
  targets_json:
    type: list
    default: []
    label: "Compute targets"
    description: >-
      Machines with GPUs where models run, as JSON, e.g. [{"id": "remote-1",
      "label": "Remote target", "base_url": "http://<host>:<port>", "kind":
      "lan", "vram_gb": <VRAM>, "ram_gb": <RAM>}]. The
      model_forge_target_add tool stores targets too (it asks for your
      approval first); entries here win on id conflicts. 'local' is always
      present. To just point at an engine's HTTP API (no GPU budget to
      declare), use Declared engine endpoints below instead.
  engines_json:
    type: list
    default: []
    label: "Declared engine endpoints"
    description: >-
      Point Model Forge at any inference engine HTTP API that automatic
      detection may not find — the bring-your-own-engine path. JSON list of
      {"label": "...", "base_url": "http://<host>:<port>"} entries, e.g.
      [{"label": "Workstation vLLM", "base_url": "http://gpu-box.example.com:8000"}].
      Every declared endpoint is probed wherever engines are detected
      (status, browse, install, activate) and reported as user-declared
      alongside auto-detected engines. Use Compute targets above when the
      machine's GPU/VRAM should price model fit; use this field when you
      only have an engine URL.
  image_base_url:
    type: str
    default: ""
    label: "Image generation endpoint URL (optional)"
    description: >-
      Base URL for native image_generate via Model Forge — either an OpenAI-
      compatible /v1 images API (vLLM-Omni, SGLang Diffusion, media facade)
      or a raw ComfyUI URL (e.g. http://127.0.0.1:8188).
  image_default_model:
    type: str
    default: ""
    label: "Default image model or workflow (optional)"
    description: "Default image model/workflow id when none is named."
  video_base_url:
    type: str
    default: ""
    label: "Video generation endpoint URL (optional)"
    description: >-
      Base URL for native video_generate via Model Forge — either an OpenAI-
      compatible /v1 videos API or a raw ComfyUI URL (e.g. http://127.0.0.1:8188).
  video_default_model:
    type: str
    default: ""
    label: "Default video model or workflow (optional)"
    description: "Default video model/workflow id when none is named."
  download_roots:
    type: list
    default: []
    label: "Extra download roots"
    description: >-
      Optional absolute directories where model_forge_install may place
      downloaded files, e.g. ["/home/you/models"]. Downloads are always
      confined to the plugin's downloads dir plus these roots; symlinks are
      refused.
  hf_token:
    type: secret
    env: HF_TOKEN
    required: false
    label: "Hugging Face token (optional)"
    description: >-
      Optional. Paste a token here or provide it through Hermes' secret store
      — either way it is kept in the Hermes secret store under HF_TOKEN (never
      in config files) and read only through the secret scope. Unlocks gated
      Hugging Face repos and full-speed pulls. Sent only to huggingface.co
      hosts. Leave empty to pull anonymously.
  modelscope_token:
    type: secret
    env: MODELSCOPE_API_TOKEN
    required: false
    label: "ModelScope token (optional)"
    description: >-
      Optional. Paste a token here or provide it through Hermes' secret store
      — either way it is kept in the Hermes secret store under
      MODELSCOPE_API_TOKEN (never in config files) and read only through the
      secret scope. Authenticated pulls from ModelScope mirrors. Sent only to
      modelscope.cn hosts. Leave empty to pull anonymously.
provides_tools:
  - model_forge_status
  - model_forge_browse
  - model_forge_target_add
  - model_forge_install
  - model_forge_activate
  - model_forge_generate_media
  - model_forge_storage
  - model_forge_broker
provides_hooks:
  - pre_tool_call

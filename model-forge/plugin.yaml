name: model-forge
version: 1.1.0
requires_hermes: ">=0.23.0"
description: >-
  Local models for every modality. Find your GPU, pick a model — chat, vision,
  image, image edit, video, 3D, music, SFX, voice, OCR — and Model Forge finds
  the right inference engine, pulls the model (or hands you the exact run
  command), and wires it into
  Hermes. Disclosure: probes only the engine endpoints you configure
  (compute targets and declared engine endpoints) and the public HuggingFace
  API; downloads model files into the plugin data dir (optional extra
  download roots in settings); writes your Hermes config (default model and
  a custom_providers entry) only after human approval — the same gate covers
  target registration, storage deletion, and vendor engine installers.
  Optional Hugging Face / ModelScope tokens are sent to their own hosts
  only. No telemetry.
author: anai (Pewpy)
license: MIT
config_schema:
  targets_json:
    type: list
    default: []
    label: "Compute targets"
    description: >-
      Machines with GPUs where models run, as JSON, e.g. [{"id": "remote-1",
      "label": "Remote target", "base_url": "http://<host>:<port>", "kind":
      "lan", "vram_gb": <VRAM>, "ram_gb": <RAM>}]. The
      model_forge_target_add tool stores targets too (it asks for your
      approval first); entries here win on id conflicts. 'local' is always
      present. To just point at an engine's HTTP API (no GPU budget to
      declare), use Declared engine endpoints below instead.
  engines_json:
    type: list
    default: []
    label: "Declared engine endpoints"
    description: >-
      Point Model Forge at any inference engine HTTP API that automatic
      detection may not find — the bring-your-own-engine path. JSON list of
      {"label": "...", "base_url": "http://<host>:<port>"} entries, e.g.
      [{"label": "Workstation vLLM", "base_url": "http://gpu-box.example.com:8000"}].
      Every declared endpoint is probed wherever engines are detected
      (status, browse, install, activate) and reported as user-declared
      alongside auto-detected engines. Use Compute targets above when the
      machine's GPU/VRAM should price model fit; use this field when you
      only have an engine URL.
  download_roots:
    type: list
    default: []
    label: "Extra download roots"
    description: >-
      Optional absolute directories where model_forge_install may place
      downloaded files, e.g. ["/home/you/models"]. Downloads are always
      confined to the plugin's downloads dir plus these roots; symlinks are
      refused.
  hf_token:
    type: secret
    env: HF_TOKEN
    required: false
    label: "Hugging Face token (optional)"
    description: >-
      Optional. Paste a token here or provide it through Hermes' secret store
      — either way it is kept in the Hermes secret store under HF_TOKEN (never
      in config files) and read only through the secret scope. Unlocks gated
      Hugging Face repos and full-speed pulls. Sent only to huggingface.co
      hosts. Leave empty to pull anonymously.
  modelscope_token:
    type: secret
    env: MODELSCOPE_API_TOKEN
    required: false
    label: "ModelScope token (optional)"
    description: >-
      Optional. Paste a token here or provide it through Hermes' secret store
      — either way it is kept in the Hermes secret store under
      MODELSCOPE_API_TOKEN (never in config files) and read only through the
      secret scope. Authenticated pulls from ModelScope mirrors. Sent only to
      modelscope.cn hosts. Leave empty to pull anonymously.
provides_tools:
  - model_forge_status
  - model_forge_browse
  - model_forge_target_add
  - model_forge_install
  - model_forge_activate
  - model_forge_generate_media
  - model_forge_storage
  - model_forge_broker
provides_hooks:
  - pre_tool_call

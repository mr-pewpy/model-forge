name: model-forge-image
kind: backend
version: 0.1.0
description: "Model Forge local image generation backend — routes image_generate to any OpenAI-compatible images API (media gateway, vLLM-Omni, SGLang Diffusion)."
author: anai (Charles / Pewpy)
license: MIT
config_schema:
  base_url:
    type: str
    default: ""
    label: "Images endpoint base URL"
    description: "e.g. http://gpu-box.example.com:8080/v1 — any OpenAI-compatible images API."
  default_model:
    type: str
    default: ""
    label: "Default model id"
    description: "Model/workflow id to use when the caller names none (blank = first from /v1/models)."

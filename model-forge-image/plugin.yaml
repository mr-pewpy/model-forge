name: model-forge-image
kind: backend
version: 1.3.0
requires_hermes: ">=0.23.0"
description: "Model Forge local image generation backend — routes image_generate to any OpenAI-compatible images API (media gateway, vLLM-Omni, SGLang Diffusion). Disclosure: sends prompts and image bytes to the single endpoint you configure and reads that endpoint's /models listing to resolve a default model; local image inputs pass the Hermes read-block check, image magic bytes, and a 25 MB cap. No other network, no telemetry."
author: anai (Pewpy)
license: MIT
python_dependencies:
  - "openai>=1,<3"
  - "httpx>=0.27,<1"
config_schema:
  base_url:
    type: str
    default: ""
    label: "Images endpoint base URL"
    description: "Base URL of any OpenAI-compatible images API, e.g. http://<host>:<port>/v1."
  default_model:
    type: str
    default: ""
    label: "Default model id"
    description: "Model/workflow id to use when the caller names none (blank = first from /v1/models)."
